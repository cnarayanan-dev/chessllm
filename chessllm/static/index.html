<!doctype html>
<!--
  The play window. It runs no chess logic (ADR 0001): the backend sends the human's legal moves
  with every state, and the board only uses that list to snap back illegal drags.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChessLLM</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cm-chessboard@8.15.3/assets/chessboard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cm-chessboard@8.15.3/assets/extensions/markers/markers.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cm-chessboard@8.15.3/assets/extensions/promotion-dialog/promotion-dialog.css">
<style>
  :root {
    --bg: #ffffff; --soft: #f7f7f5; --hover: #efefed; --ink: #37352f; --muted: #787774; --faint: #9b9a97;
    --line: #e9e9e7; --accent: #2383e2; --red: #e03e3e; --red-soft: #fbe4e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919; --soft: #202020; --hover: #2c2c2c; --ink: #e6e6e4; --muted: #9b9b9b; --faint: #6f6f6f;
      --line: #2f2f2f; --accent: #529cca; --red: #ff7369; --red-soft: #3a2422;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Helvetica, sans-serif; }
  button { font: inherit; color: inherit; }
  .top { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
  .top .brand { font-weight: 600; }
  .top .spacer { flex: 1; }
  .ghost { border: 0; background: transparent; padding: 5px 8px; border-radius: 5px; cursor: pointer; color: var(--muted); }
  .ghost:hover { background: var(--hover); }
  .layout { display: grid; grid-template-columns: minmax(320px, 560px) 340px; gap: 32px; justify-content: center; padding: 28px 20px 40px; }
  @media (max-width: 960px) { .layout { grid-template-columns: minmax(280px, 560px); } }
  #board { width: 100%; aspect-ratio: 1 / 1; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-bottom: 6px; }
  .moves { font-family: ui-monospace, monospace; font-size: 13px; min-height: 1.5em; }
  .status { color: var(--muted); }
  .callout { border-left: 3px solid var(--red); background: var(--red-soft); border-radius: 4px; padding: 8px 10px; font-size: 13px; }
  .callout[hidden] { display: none; }
  .callouts { display: flex; flex-direction: column; gap: 6px; }
  .callouts:empty { display: none; }
  .thinking summary { cursor: pointer; color: var(--muted); }
  .thinking[hidden] { display: none; }
  .thinking-text { margin-top: 8px; max-height: 320px; overflow-y: auto; white-space: pre-wrap; font-size: 13px; color: var(--muted); }
  .banner { border: 1px solid var(--line); background: var(--soft); border-radius: 6px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .banner[hidden] { display: none; }
  .banner .title { font-size: 16px; font-weight: 600; }
  .banner .reason { color: var(--muted); }
  .banner .spacer { flex: 1; }
  .banner button { border: 1px solid var(--line); background: var(--bg); padding: 5px 10px; border-radius: 5px; cursor: pointer; }
  .banner button:hover { background: var(--hover); }
  footer { text-align: center; color: var(--faint); font-size: 12px; padding: 0 20px 24px; }
</style>
</head>
<body>

<div class="top">
  <span class="brand">♞ ChessLLM</span>
  <span class="spacer"></span>
  <button class="ghost" id="newGame">New game</button>
</div>

<div class="layout">
  <div id="board"></div>
  <div class="side">
    <div class="banner" id="banner" hidden>
      <div><div class="title" id="bannerTitle"></div><div class="reason" id="bannerReason"></div></div>
      <span class="spacer"></span>
      <button id="bannerNewGame">New game</button>
    </div>
    <div class="card"><div class="status" id="status">Loading…</div></div>
    <div class="callout" id="error" hidden></div>
    <div class="callouts" id="callouts"></div>
    <details class="card thinking" id="thinkingPanel" hidden>
      <summary>Show thinking</summary>
      <div class="thinking-text" id="thinking"></div>
    </details>
    <div class="card">
      <div class="label">Moves</div>
      <div class="moves" id="moves"></div>
    </div>
  </div>
</div>

<footer>Pieces: Merida by Armando Hernandez Marroquin, GPLv2+</footer>

<script type="module">
import {Chessboard, COLOR, INPUT_EVENT_TYPE} from "https://cdn.jsdelivr.net/npm/cm-chessboard@8.15.3/src/Chessboard.js"
import {Markers, MARKER_TYPE} from "https://cdn.jsdelivr.net/npm/cm-chessboard@8.15.3/src/extensions/markers/Markers.js"
import {PromotionDialog, PROMOTION_DIALOG_RESULT_TYPE} from "https://cdn.jsdelivr.net/npm/cm-chessboard@8.15.3/src/extensions/promotion-dialog/PromotionDialog.js"

const $ = id => document.getElementById(id)
const board = new Chessboard($("board"), {
  assetsUrl: "https://cdn.jsdelivr.net/npm/cm-chessboard@8.15.3/assets/",
  style: {pieces: {file: "/static/pieces/merida.svg"}},
  extensions: [{class: Markers, props: {autoMarkers: MARKER_TYPE.frame}}, {class: PromotionDialog}],
})
let state = null

const RESULT_TITLES = {"1-0": "White wins", "0-1": "Black wins", "1/2-1/2": "Draw"}
const END_REASONS = {
  checkmate: "by checkmate",
  stalemate: "by stalemate",
  threefold_repetition: "by threefold repetition",
  fifty_moves: "by the fifty-move rule",
  insufficient_material: "by insufficient material",
  forfeit: "by forfeit",
}

function showBanner() {
  const over = state.status === "over"
  $("banner").hidden = !over
  if (!over) return
  $("bannerTitle").textContent = RESULT_TITLES[state.result] ?? state.result
  $("bannerReason").textContent = END_REASONS[state.end_reason] ?? `by ${state.end_reason.replaceAll("_", " ")}`
}

// One red callout per failed attempt of the LLM's last turn. They stack, and clear when the next turn starts.
function showCallouts() {
  const failed = (state.llm_turn?.attempts ?? []).filter(attempt => attempt.result !== "legal")
  $("callouts").replaceChildren(...failed.map(attempt => {
    const callout = document.createElement("div")
    callout.className = "callout"
    const number = state.llm_turn.attempts.indexOf(attempt) + 1
    callout.textContent = attempt.error
      ? `⚠ ${attempt.error}`
      : `⚠ LLM move illegal: "${attempt.move}" (${attempt.result} move), attempt ${number} of 4`
    return callout
  }))
}

async function api(method, path, body) {
  const response = await fetch(path, {
    method,
    headers: body ? {"Content-Type": "application/json"} : {},
    body: body ? JSON.stringify(body) : undefined,
  })
  if (!response.ok) throw new Error((await response.json()).detail ?? response.statusText)
  return response.json()
}

async function show(next) {
  const animate = state !== null // the first position appears at once instead of fading in from an empty board
  state = next
  $("moves").textContent = state.pgn
  $("status").textContent = state.status === "over" ? "Game over" : state.turn === "white" ? "Your move (White)" : "Waiting for Black…"
  showBanner()
  showCallouts()
  const thinking = state.llm_turn?.thinking
  $("thinkingPanel").hidden = !thinking
  $("thinking").textContent = thinking ?? ""
  board.removeMarkers(MARKER_TYPE.square)
  if (state.last_move) {
    board.addMarker(MARKER_TYPE.square, state.last_move.slice(0, 2))
    board.addMarker(MARKER_TYPE.square, state.last_move.slice(2, 4))
  }
  await board.setPosition(state.fen, animate)
  board.disableMoveInput() // stays locked once the game is over, until "New game"
  if (state.status === "playing" && state.human_legal_moves.length) board.enableMoveInput(onMoveInput, COLOR.white)
}

// The board stays locked while the LLM thinks, and a running timer shows the app has not frozen.
async function play(uci) {
  board.disableMoveInput()
  $("newGame").disabled = true
  $("error").hidden = true
  $("thinkingPanel").hidden = true
  $("callouts").replaceChildren()
  const started = Date.now()
  const tick = () => {
    const seconds = Math.floor((Date.now() - started) / 1000)
    $("status").textContent = `${state.settings.model} is thinking… ${seconds}s`
  }
  tick()
  const timer = setInterval(tick, 1000)
  let next = state // on an error, snap the piece back to the backend's position
  try {
    next = await api("POST", "/api/games/current/moves", {uci})
  } catch (error) {
    $("error").textContent = error.message
    $("error").hidden = false
  } finally {
    clearInterval(timer)
    $("newGame").disabled = false
  }
  await show(next)
}

function onMoveInput(event) {
  const legal = state.human_legal_moves
  switch (event.type) {
    case INPUT_EVENT_TYPE.moveInputStarted:
      return legal.some(uci => uci.startsWith(event.squareFrom))
    case INPUT_EVENT_TYPE.validateMoveInput: {
      const uci = event.squareFrom + event.squareTo
      if (legal.includes(uci)) {
        play(uci)
        return true
      }
      if (legal.includes(uci + "q")) {
        board.showPromotionDialog(event.squareTo, COLOR.white, result => {
          if (result.type === PROMOTION_DIALOG_RESULT_TYPE.pieceSelected) play(uci + result.piece.charAt(1))
          else show(state)
        })
        return true
      }
      return false
    }
  }
}

async function newGame() {
  $("error").hidden = true
  await show(await api("POST", "/api/games"))
}
$("newGame").onclick = newGame
$("bannerNewGame").onclick = newGame

try {
  await show(await api("GET", "/api/games/current"))
} catch {
  await show(await api("POST", "/api/games"))
}
</script>
</body>
</html>
