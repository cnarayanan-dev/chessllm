[project]
name = "chessllm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.144.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
chessllm = "chessllm.__main__:main"
anchor-match = "chessllm.cli.anchor_match:main"
anchor-batch = "chessllm.cli.anchor_batch:main"
faceoff-batch = "chessllm.cli.faceoff_batch:main"
analyse-games = "chessllm.cli.analyse:main"
games-report = "chessllm.cli.report:main"
tools-experiment = "chessllm.cli.tools_experiment:main"

# The package ships whole: its data files (sampling.toml, move_quality_validation.json, the prompts and static/) are
# in the module directory, which uv_build includes as it is.
[build-system]
requires = ["uv_build>=0.10.12,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "resvg-py>=0.5.0",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Live tests against a real Ollama model, Maia-2, Dragon or Stockfish are left out unless asked for with
# `pytest -m ollama`, `pytest -m maia2`, `pytest -m dragon` or `pytest -m stockfish`.
addopts = "-m 'not ollama and not maia2 and not dragon and not stockfish'"
markers = [
    "ollama: live test against a real Ollama model",
    "maia2: live test against the real Maia-2 model, run by uv in an environment of its own",
    "dragon: live test against the real Komodo Dragon 1 (set CHESSLLM_DRAGON)",
    "stockfish: live test against a real Stockfish engine on the PATH",
]

[tool.mypy]
strict = true
packages = ["chessllm", "scripts"]

# The Maia-2 worker runs in its own environment (see chessllm/engines/maia2_model.py), so maia2 and torch aren't here.
[[tool.mypy.overrides]]
module = ["maia2.*", "torch"]
ignore_missing_imports = true
