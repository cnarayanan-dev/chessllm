[project]
name = "chessllm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.144.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Live tests against a real Ollama model are left out unless asked for with `pytest -m ollama`.
addopts = "-m 'not ollama'"
markers = ["ollama: live test against a real Ollama model"]

[tool.mypy]
strict = true
packages = ["chessllm"]
