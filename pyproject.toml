[project]
name = "chessllm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.144.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Live tests against a real Ollama model or Maia-2 are left out unless asked for with `pytest -m ollama` or
# `pytest -m maia2`.
addopts = "-m 'not ollama and not maia2'"
markers = [
    "ollama: live test against a real Ollama model",
    "maia2: live test against the real Maia-2 model, run by uv in an environment of its own",
]

[tool.mypy]
strict = true
packages = ["chessllm"]

# The Maia-2 worker runs in its own environment (see chessllm/maia2_model.py), so maia2 and torch aren't here.
[[tool.mypy.overrides]]
module = ["maia2.*", "torch"]
ignore_missing_imports = true
